<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teacher's Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Hero Banner -->
  <header class="hero">
    <h1>Happy Teacher's Day Sir.</h1>
    <p>Thank you for inspiring, guiding, and shaping our future.</p>
    <p>Thank you for becoming a tree and giving us the warmth,shade,love. </p>
    <button onclick="showWish()">Click for a Special Wish</button>
  </header>

  <!-- Interactive Message Section -->
  <main class="container">
    <div class="card">
      <h2>A Message For You:</h2>
      <p id="wish-text">Teachers plant seeds that grow forever.</p>
      <p>We are your seeds who will grow to become ,the light bearer of next generation.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
